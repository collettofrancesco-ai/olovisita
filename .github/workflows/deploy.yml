name: Test & Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Installa dipendenze
        run: npm ci

      - name: Installa browser Playwright
        run: npx playwright install --with-deps chromium

      - name: Esegui test E2E
        run: npx playwright test --reporter=list,html,github

      - name: Riepilogo test nel job summary
        if: always()
        run: |
          echo "## Risultati Test E2E — $(date '+%d/%m/%Y %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Suite | Test | Esito |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| login.spec.js | 5 | - |" >> $GITHUB_STEP_SUMMARY
          echo "| schedule_visit.spec.js | 4 | - |" >> $GITHUB_STEP_SUMMARY
          echo "| urgent_visit.spec.js | 6 | - |" >> $GITHUB_STEP_SUMMARY
          echo "| consent_flow.spec.js | 5 | - |" >> $GITHUB_STEP_SUMMARY
          echo "| demo.spec.js | 4 | - |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f playwright-report/index.html ]; then
            PASSED=$(grep -o '"passed":[0-9]*' playwright-report/index.html 2>/dev/null | head -1 | grep -o '[0-9]*' || echo "?")
            FAILED=$(grep -o '"failed":[0-9]*' playwright-report/index.html 2>/dev/null | head -1 | grep -o '[0-9]*' || echo "?")
            echo "**Totale: $PASSED/24 superati, $FAILED falliti**" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "_Report HTML completo disponibile nell'artefatto \`playwright-report\`_" >> $GITHUB_STEP_SUMMARY

      - name: Upload report test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_number }}
          path: playwright-report/
          retention-days: 30

  deploy:
    name: Deploy GitHub Pages
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry1.outputs.page_url || steps.retry2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Attendo 20s prima del retry 1
        if: steps.deployment.outcome == 'failure'
        run: sleep 20

      - id: retry1
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Attendo 30s prima del retry 2
        if: steps.deployment.outcome == 'failure' && steps.retry1.outcome == 'failure'
        run: sleep 30

      - id: retry2
        if: steps.deployment.outcome == 'failure' && steps.retry1.outcome == 'failure'
        uses: actions/deploy-pages@v4
